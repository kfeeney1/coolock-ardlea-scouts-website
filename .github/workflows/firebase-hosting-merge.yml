# This file was auto-generated by the Firebase CLI
# https://firebase.google.com/docs/hosting/github-integration

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Organisation Chart Backfill
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"
jobs:
  build_and_deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install app dependencies
        run: npm ci
      - name: Install Firebase Admin for public snapshot export
        run: npm install --no-save --package-lock=false firebase-admin@14.3.0
      - name: Preserve last good public organisation snapshot
        run: |
          mkdir -p /tmp/public-org
          if curl -fsSL https://coolock-ardlea-scouts.web.app/public-leadership.json -o /tmp/public-org/public-leadership.json; then
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/public-org/public-leadership.json','utf8')); if(!Array.isArray(p) || p.length===0) process.exit(1);" || rm -f /tmp/public-org/public-leadership.json
          fi
      - name: Export public organisation snapshot
        id: organisation_snapshot
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/export-public-leadership.mjs
      - name: Restore last good organisation snapshot
        if: ${{ steps.organisation_snapshot.outcome == 'failure' }}
        run: |
          if [ -f /tmp/public-org/public-leadership.json ]; then
            cp /tmp/public-org/public-leadership.json public/public-leadership.json
            echo '::warning::Could not refresh public organisation snapshot; preserving the last known good hosted snapshot.'
          else
            echo '::warning::Could not refresh public organisation snapshot and no previous non-empty snapshot is available. The valid empty snapshot will be deployed without falling back to Firestore.'
          fi
      - name: Build site
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_EMAIL_API_URL: ${{ secrets.VITE_EMAIL_API_URL }}
      - name: Verify public organisation snapshot is deployable
        run: |
          test -f dist/public-leadership.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('dist/public-leadership.json','utf8')); if(!Array.isArray(p)) process.exit(1); console.log('Deploying public organisation snapshot with', p.length, 'leader(s)');"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
          channelId: live
          projectId: coolock-ardlea-scouts
