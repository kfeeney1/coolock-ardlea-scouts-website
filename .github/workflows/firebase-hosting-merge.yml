# This file was auto-generated by the Firebase CLI
# https://firebase.google.com/docs/hosting/github-integration

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_run:
    workflows:
      - Organisation Chart Backfill
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"

permissions:
  contents: read
  checks: write

concurrency:
  group: firebase-live-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install app dependencies
        run: npm ci
      - name: Install Firebase Admin SDK for deployment data checks
        run: npm install --no-save --ignore-scripts firebase-admin
      - name: Restore canonical comprehensive seed population
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Canonical seed attempt ${attempt}/3"
            if node scripts/seed-population-data.mjs seed; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "Canonical seed attempt ${attempt} failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "Canonical seed failed after 3 attempts."
          exit 1
      - name: Restore canonical public website content
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/seed-public-site-content.mjs seed
      - name: Reconcile live test accounts to canonical seed data
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/reconcile-seeded-accounts.mjs
      - name: Remove leadership outside canonical seed or approved registrations
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/reconcile-leadership-provenance.mjs
      - name: Rebuild curated public Who's Who
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/rebuild-public-leadership.mjs
      - name: Verify public Who's Who projection
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/verify-public-leadership.mjs
      - name: Build site
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_EMAIL_API_URL: ${{ secrets.VITE_EMAIL_API_URL }}
      - name: Stamp build with deployed commit SHA
        run: sed -i "s#</head>#<meta name=\"app-build-sha\" content=\"${GITHUB_SHA}\"></head>#" dist/index.html
      - name: Deploy Firestore rules when IAM permits
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: |
          set +e
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-service-account.json
          RULES_OUTPUT=$(GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json npx --yes firebase-tools@15.28.1 deploy --only firestore:rules --project coolock-ardlea-scouts 2>&1)
          RULES_STATUS=$?
          rm -f /tmp/firebase-service-account.json
          printf '%s\n' "$RULES_OUTPUT"

          if [ "$RULES_STATUS" -eq 0 ]; then
            exit 0
          fi

          if printf '%s' "$RULES_OUTPUT" | grep -q "The caller does not have permission"; then
            echo "::warning::Firestore rules deployment skipped because this service account lacks Firebase Rules deployment permission. Hosting deployment will continue; rule tests and post-deploy smoke remain blocking checks."
            exit 0
          fi

          exit "$RULES_STATUS"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
          channelId: live
          projectId: coolock-ardlea-scouts
