name: Firebase PRODUCTION Manual Deploy

on:
  workflow_dispatch:
    inputs:
      production_project_id:
        description: 'Type the exact production Firebase project ID'
        required: true
        type: string
      commit_sha:
        description: 'Exact full commit SHA from main to deploy'
        required: true
        type: string

permissions:
  contents: read
  checks: read

env:
  DEPLOY_ENVIRONMENT: production
  FIREBASE_PROJECT_ID: coolock-ardlea-scouts

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  validate_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require exact production confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.production_project_id }}" = "$FIREBASE_PROJECT_ID" || {
            echo '::error::Production project confirmation does not match.'
            exit 1
          }
          [[ "${{ inputs.commit_sha }}" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::A full 40-character commit SHA is required.'
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify SHA is contained in current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${{ inputs.commit_sha }}" origin/main || {
            echo '::error::Requested SHA is not contained in current main.'
            exit 1
          }
      - name: Verify required CI evidence for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for required_check in 'build' 'Playwright E2E'; do
            conclusions="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" --jq ".check_runs[] | select(.name == \"${required_check}\") | .conclusion")"
            if ! grep -qx 'success' <<< "$conclusions"; then
              echo "::error::Required successful check missing for ${required_check} on ${TARGET_SHA}."
              exit 1
            fi
          done
      - name: Install application and pinned Firebase test tooling
        run: |
          npm ci
          npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools@15.28.1
      - name: Re-run release security checks
        run: |
          npm run check:workflow-credentials
          npm run check:firebase-deploy-config
          npm run lint
          npm test
      - name: Re-run Firestore Rules tests on emulators
        run: npx firebase emulators:exec --only firestore --project demo-coolock-ardlea-scouts "node --test --test-concurrency=1 tests/firestore/*.test.mjs"
      - name: Re-run Storage Rules tests on emulators
        run: npx firebase emulators:exec --only firestore,storage --project demo-coolock-ardlea-scouts "node --test --test-concurrency=1 tests/storage/*.test.mjs"
      - name: Validate production credential target
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION }}
        run: node scripts/validate-firebase-environment.mjs --environment production --project "$FIREBASE_PROJECT_ID" --credential-env FIREBASE_SERVICE_ACCOUNT_JSON
      - name: Build PRODUCTION artifact
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_BUILD_COMMIT: ${{ inputs.commit_sha }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_EMAIL_API_URL: ${{ vars.VITE_EMAIL_API_URL }}
      - name: Deploy reviewed Rules, indexes, Storage rules and Hosting to PRODUCTION
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-service-account.json
          trap 'rm -f /tmp/firebase-service-account.json' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          npx --yes firebase-tools@15.28.1 deploy --only firestore:rules,firestore:indexes,storage,hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Read-only post-deployment verification
        run: |
          node scripts/check-live-build-info.mjs
          npm run smoke:live
        env:
          SITE_URL: ${{ vars.FIREBASE_HOSTING_URL }}
          EMAIL_API_URL: ${{ vars.VITE_EMAIL_API_URL }}
          FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: coolock-ardlea-scouts
          FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_STORAGE_ENABLED: ${{ vars.FIREBASE_STORAGE_ENABLED }}
          EXPECTED_BUILD_SHA: ${{ inputs.commit_sha }}
      - name: Record release evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### Production deployment evidence'
            echo "- Actor: $GITHUB_ACTOR"
            echo "- SHA: ${{ inputs.commit_sha }}"
            echo "- Target: $FIREBASE_PROJECT_ID"
            echo "- Workflow run: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
