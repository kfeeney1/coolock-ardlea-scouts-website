name: Firebase PRODUCTION Manual Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  DEPLOY_ENVIRONMENT: production
  FIREBASE_PROJECT_ID: coolock-ardlea-scouts
  PRODUCTION_STORAGE_BUCKET: coolock-ardlea-scouts.firebasestorage.app
  PRODUCTION_URL: https://coolockardleascouts.ie

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  validate_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve current main release SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          TARGET_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
          test "$TARGET_SHA" = "$REMOTE_MAIN_SHA" || {
            echo '::error::Checked-out release does not match current origin/main.'
            exit 1
          }
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying reviewed main SHA: $TARGET_SHA"
      - name: Wait for required CI evidence for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # A manual production deploy can be started immediately after a merge,
          # before push-triggered quality/e2e checks have finished (or even appeared).
          # Wait for the latest run of each required check on the exact release SHA.
          deadline=$((SECONDS + 2700))

          for required_check in 'quality' 'e2e'; do
            echo "Waiting for ${required_check} on ${TARGET_SHA}..."

            while (( SECONDS < deadline )); do
              latest="$(
                gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" \
                  --jq ".check_runs
                    | map(select(.name == \"${required_check}\"))
                    | sort_by(.id)
                    | last
                    | if . == null then \"missing\\t\" else [.status, (.conclusion // \"\")] | @tsv end"
              )"

              status="${latest%%$'\t'*}"
              conclusion="${latest#*$'\t'}"

              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                echo "${required_check}: success"
                break
              fi

              if [[ "$status" == "completed" && -n "$conclusion" && "$conclusion" != "success" ]]; then
                echo "::error::Required check ${required_check} completed with ${conclusion} on ${TARGET_SHA}."
                exit 1
              fi

              echo "${required_check}: ${status}${conclusion:+/${conclusion}}; checking again in 30s"
              sleep 30
            done

            if (( SECONDS >= deadline )); then
              echo "::error::Timed out waiting for required check ${required_check} on ${TARGET_SHA}."
              exit 1
            fi
          done
      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install application and pinned Firebase test tooling
        run: |
          npm ci
          npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools@15.28.1
      - name: Re-run release security checks
        run: |
          npm run check:workflow-production-credentials
          npm run check:firebase-deploy-config
          npm run lint
          npm test
      - name: Re-run Firestore Rules tests on emulators
        env:
          FIREBASE_PROJECT_ID: demo-coolock-ardlea-scouts
        run: npx firebase emulators:exec --only firestore --project "$FIREBASE_PROJECT_ID" "node --test --test-concurrency=1 tests/firestore/*.test.mjs"
      - name: Re-run Storage Rules tests on emulators
        env:
          FIREBASE_PROJECT_ID: demo-coolock-ardlea-scouts
        run: npx firebase emulators:exec --only firestore,storage --project "$FIREBASE_PROJECT_ID" "node --test --test-concurrency=1 tests/storage/*.test.mjs"
      - name: Validate production credential target
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION }}
        run: node scripts/validate-firebase-environment.mjs --environment production --project "$FIREBASE_PROJECT_ID" --credential-env FIREBASE_SERVICE_ACCOUNT_JSON
      - name: Validate production public configuration
        run: npm run check:production-env
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_EMAIL_API_URL: ${{ vars.VITE_EMAIL_API_URL }}
      - name: Build PRODUCTION artifact
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_BUILD_COMMIT: ${{ steps.release.outputs.sha }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_EMAIL_API_URL: ${{ vars.VITE_EMAIL_API_URL }}
      - name: Deploy reviewed Rules, indexes, Storage rules and Hosting to PRODUCTION
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-service-account.json
          trap 'rm -f /tmp/firebase-service-account.json firebase.production.generated.json' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json

          # New default buckets use PROJECT_ID.firebasestorage.app. Bind the reviewed
          # Storage rules to the exact production bucket instead of relying on the
          # CLI's default-bucket discovery. Keep the generated config in the repo
          # root so Firebase resolves the adjacent .firebaserc target mapping.
          npx --yes firebase-tools@15.28.1 target:apply storage production-default "$PRODUCTION_STORAGE_BUCKET" --project "$FIREBASE_PROJECT_ID" --non-interactive
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          config.storage = [{ target: 'production-default', rules: 'storage.rules' }];
          fs.writeFileSync('firebase.production.generated.json', JSON.stringify(config, null, 2));
          NODE

          npx --yes firebase-tools@15.28.1 deploy --only firestore:rules,firestore:indexes,storage:production-default,hosting --project "$FIREBASE_PROJECT_ID" --config firebase.production.generated.json --non-interactive
      - name: Read-only post-deployment verification on custom domain
        run: |
          node scripts/check-live-build-info.mjs
          npm run smoke:live
        env:
          SITE_URL: ${{ env.PRODUCTION_URL }}
          EMAIL_API_URL: ${{ vars.VITE_EMAIL_API_URL }}
          FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: coolock-ardlea-scouts
          FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_STORAGE_ENABLED: 'true'
          EXPECTED_BUILD_SHA: ${{ steps.release.outputs.sha }}
      - name: Record release evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### Production deployment evidence'
            echo "- Actor: $GITHUB_ACTOR"
            echo "- SHA: ${{ steps.release.outputs.sha }}"
            echo "- Target: $FIREBASE_PROJECT_ID"
            echo "- URL: $PRODUCTION_URL"
            echo "- Workflow run: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
