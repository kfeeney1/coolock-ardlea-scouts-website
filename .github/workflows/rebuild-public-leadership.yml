name: Rebuild Public Who's Who

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type REBUILD PUBLIC LEADERSHIP coolock-ardlea-scouts'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-public-leadership-rebuild
  cancel-in-progress: false

env:
  DEPLOY_ENVIRONMENT: production
  FIREBASE_PROJECT_ID: coolock-ardlea-scouts

jobs:
  rebuild:
    if: ${{ inputs.confirmation == 'REBUILD PUBLIC LEADERSHIP coolock-ardlea-scouts' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Firebase Admin SDK
        run: npm install --no-save --ignore-scripts firebase-admin@14.3.0
      - name: Validate production credential target
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION }}
        run: node scripts/validate-firebase-environment.mjs --environment production --project "$FIREBASE_PROJECT_ID" --credential-env FIREBASE_SERVICE_ACCOUNT_JSON
      - name: Rebuild curated public leadership collection
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION }}
          PRODUCTION_PROJECT_CONFIRMATION: coolock-ardlea-scouts
          ALLOW_PRODUCTION_MUTATION: I_UNDERSTAND
        run: node scripts/rebuild-public-leadership.mjs --execute --allow-production
      - name: Verify live Firestore compatibility
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION }}
        run: node scripts/audit-firestore-compatibility.mjs
