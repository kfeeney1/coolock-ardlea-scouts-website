name: Firestore Rules

on:
  pull_request:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "tests/firestore/**"
      - "src/services/**"
      - "src/firebase.ts"
      - "src/components/admin/AdminAuthProvider.tsx"
      - ".github/workflows/firestore-rules.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        run: npm ci

      - name: Install pinned Firebase test tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools@15.28.1

      - name: Run Firestore rules tests
        # Each file clears the same emulator project in beforeEach, so file-level parallelism causes cross-test data races.
        run: npx firebase emulators:exec --only firestore --project coolock-ardlea-scouts "node --test --test-concurrency=1 tests/firestore/*.test.mjs"

      - name: Authenticate to Firebase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}

      - name: Deploy Firestore rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx firebase deploy --only firestore:rules --project coolock-ardlea-scouts --non-interactive
