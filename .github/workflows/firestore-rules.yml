name: Firebase Rules

on:
  pull_request:
    branches: [main]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - "tests/firestore/**"
      - "tests/storage/**"
      - "src/services/**"
      - "src/firebase.ts"
      - "src/components/admin/AdminAuthProvider.tsx"
      - ".github/workflows/firestore-rules.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: demo-coolock-ardlea-scouts

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        run: npm ci

      - name: Install pinned Firebase test tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@6.0.0 firebase-tools@15.28.1

      - name: Run Firestore rules tests
        run: npx firebase emulators:exec --only firestore --project "$FIREBASE_PROJECT_ID" "node --test --test-concurrency=1 tests/firestore/*.test.mjs"

      - name: Run Storage rules tests
        run: npx firebase emulators:exec --only firestore,storage --project "$FIREBASE_PROJECT_ID" "node --test --test-concurrency=1 tests/storage/*.test.mjs"
