name: Firebase Rules

on:
  pull_request:
    branches: [main]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - "tests/firestore/**"
      - "tests/storage/**"
      - "src/services/**"
      - "src/firebase.ts"
      - "src/components/admin/AdminAuthProvider.tsx"
      - ".github/workflows/firestore-rules.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        run: npm ci

      - name: Install pinned Firebase test tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools@15.28.1

      - name: Run Firestore rules tests
        run: npx firebase emulators:exec --only firestore --project coolock-ardlea-scouts "node --test --test-concurrency=1 tests/firestore/*.test.mjs"

      - name: Run Storage rules tests
        run: npx firebase emulators:exec --only firestore,storage --project coolock-ardlea-scouts "node --test --test-concurrency=1 tests/storage/*.test.mjs"
