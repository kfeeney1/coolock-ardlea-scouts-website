name: Firestore Data Provenance Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-firestore-data-provenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase Admin
        run: npm install --no-save --package-lock=false firebase-admin@14.3.0

      - name: Prepare dry-run report
        run: mkdir -p firestore-audit-report

      - name: Inventory live TEST-data candidates
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: set -o pipefail; node scripts/inventory-live-test-data.mjs 2>&1 | tee firestore-audit-report/00-test-data-inventory.txt

      - name: Audit live Firestore provenance in one pass
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: set -o pipefail; node scripts/audit-live-data-provenance.mjs 2>&1 | tee firestore-audit-report/01-provenance.txt

      - name: Report safely migratable active leader section profiles
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: set -o pipefail; node scripts/reconcile-admin-user-sections.mjs --check 2>&1 | tee firestore-audit-report/02-leader-sections.txt

      - name: Audit live non-meeting Firestore compatibility
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: set -o pipefail; node scripts/audit-firestore-compatibility.mjs 2>&1 | tee firestore-audit-report/03-compatibility.txt

      - name: Audit live weekly meeting compatibility
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: set -o pipefail; node scripts/audit-weekly-meeting-compatibility.mjs 2>&1 | tee firestore-audit-report/04-weekly-meetings.txt

      - name: Audit live meeting record compatibility
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: set -o pipefail; node scripts/audit-meeting-record-compatibility.mjs 2>&1 | tee firestore-audit-report/05-meeting-records.txt

      - name: Require canonical meeting record schema
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: set -o pipefail; node scripts/reconcile-meeting-records.mjs --check 2>&1 | tee firestore-audit-report/06-meeting-migrations.txt

      - name: Report unprovenanced leadership records
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: set -o pipefail; node scripts/reconcile-leadership-provenance.mjs --check 2>&1 | tee firestore-audit-report/07-leadership-provenance.txt

      - name: Audit parent event-gallery access projections
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: set -o pipefail; node scripts/audit-event-gallery-access.mjs 2>&1 | tee firestore-audit-report/08-gallery-access.txt

      - name: Audit Adventure Skills nested progress
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: set -o pipefail; node --experimental-strip-types scripts/audit-adventure-skill-integrity.mjs 2>&1 | tee firestore-audit-report/09-adventure-skills.txt

      - name: Upload dry-run integrity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firestore-integrity-dry-run-${{ github.run_id }}
          path: firestore-audit-report
          if-no-files-found: warn
          retention-days: 30
