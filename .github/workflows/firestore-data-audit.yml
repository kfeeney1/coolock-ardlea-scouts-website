name: Firestore Data Compatibility Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit-firestore-compatibility.mjs"
      - "scripts/backfill-organisation-leadership.mjs"
      - "src/services/organisationChart.ts"
      - "src/services/leaderAccess.ts"
      - ".github/workflows/firestore-data-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/audit-firestore-compatibility.mjs"
      - "scripts/backfill-organisation-leadership.mjs"
      - "src/services/organisationChart.ts"
      - "src/services/leaderAccess.ts"
      - ".github/workflows/firestore-data-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase Admin
        run: npm install --no-save --package-lock=false firebase-admin@14.3.0

      - name: Audit live Firestore data against current contracts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/audit-firestore-compatibility.mjs
