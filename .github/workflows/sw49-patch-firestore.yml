name: SW-49 Firestore parity patch

on:
  push:
    branches: [sw-49-deputy-group-leader-parity]
    paths:
      - scripts/sw49-patch-firestore.mjs
      - .github/workflows/sw49-patch-firestore.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sw-49-deputy-group-leader-parity
      - name: Patch Firestore predicate
        run: node scripts/sw49-patch-firestore.mjs
      - name: Commit guarded rules change
        run: |
          if git diff --quiet -- firestore.rules; then
            echo "No Firestore patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "SW-49 grant Deputy Group Leader Firestore parity"
          git push origin HEAD:sw-49-deputy-group-leader-parity
