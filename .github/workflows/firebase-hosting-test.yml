name: Firebase TEST Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  group: firebase-test-deploy
  cancel-in-progress: false

env:
  DEPLOY_ENVIRONMENT: test
  FIREBASE_PROJECT_ID: coolock-ardlea-scouts-test

jobs:
  deploy_test:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Validate TEST credential target
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_TEST }}
        run: node scripts/validate-firebase-environment.mjs --environment test --project "$FIREBASE_PROJECT_ID" --credential-env FIREBASE_SERVICE_ACCOUNT_JSON
      - name: Wait for required CI evidence for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 2700))

          for required_check in 'quality' 'e2e' 'rules' 'audit'; do
            echo "Waiting for ${required_check} on ${TARGET_SHA}..."

            while (( SECONDS < deadline )); do
              latest="$(
                gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" \
                  --jq ".check_runs
                    | map(select(.name == \"${required_check}\"))
                    | sort_by(.id)
                    | last
                    | if . == null then \"missing\\t\" else [.status, (.conclusion // \"\")] | @tsv end"
              )"

              status="${latest%%$'\t'*}"
              conclusion="${latest#*$'\t'}"

              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                echo "${required_check}: success"
                break
              fi

              if [[ "$status" == "completed" && -n "$conclusion" && "$conclusion" != "success" ]]; then
                echo "::error::Required check ${required_check} completed with ${conclusion} on ${TARGET_SHA}."
                exit 1
              fi

              echo "${required_check}: ${status}${conclusion:+/${conclusion}}; checking again in 30s"
              sleep 30
            done

            if (( SECONDS >= deadline )); then
              echo "::error::Timed out waiting for required check ${required_check} on ${TARGET_SHA}."
              exit 1
            fi
          done
      - name: Validate target, account confirmation and isolated config
        env:
          HALL_BUILD_COMMIT: ${{ github.sha }}
          HALL_FREE_PLAN_CONFIRMED: ${{ vars.HALL_FREE_PLAN_CONFIRMED }}
          VITE_HALL_BOOKING_API_URL: ${{ vars.VITE_HALL_BOOKING_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/check-hall-test-deployment.mjs
      - name: Install Maintenance backend dependencies
        run: npm ci --prefix maintenance-functions --no-audit

      - name: Install dependencies
        run: npm ci
      - name: Validate TEST Firebase application configuration
        run: npm run check:application-env
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_HALL_BOOKING_API_URL: ${{ vars.VITE_HALL_BOOKING_API_URL }}
      - name: Build TEST artifact
        run: npm run build
        env:
          VITE_APP_ENV: test
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_EMAIL_API_URL: ""
          VITE_HALL_BOOKING_API_URL: ${{ vars.VITE_HALL_BOOKING_API_URL }}
      - name: Install existing Worker toolchain and test handler
        working-directory: email-worker
        run: |
          npm install --no-audit --no-fund
          node --test tests/*.test.js
      - name: Package reviewed TEST entry without deploying
        working-directory: email-worker
        env:
          WRANGLER_SEND_METRICS: "false"
          HALL_BUILD_COMMIT: ${{ github.sha }}
        run: npx --no-install wrangler deploy --dry-run --config wrangler.hall-test.toml --var "HALL_BUILD_COMMIT:$HALL_BUILD_COMMIT"
      - name: Deploy isolated TEST Worker
        working-directory: email-worker
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_TEST }}
          HALL_BUILD_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          export HALL_SECRET_FILE="$secret_file"
          node --input-type=module - <<'JS'
          import {writeFile} from 'node:fs/promises';
          const key = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          if (key.project_id !== 'coolock-ardlea-scouts-test' || !key.client_email?.endsWith('@coolock-ardlea-scouts-test.iam.gserviceaccount.com') || !key.private_key) throw new Error('TEST credential mismatch.');
          await writeFile(process.env.HALL_SECRET_FILE, JSON.stringify({FIREBASE_SERVICE_ACCOUNT_EMAIL: key.client_email, FIREBASE_SERVICE_ACCOUNT_PRIVATE_KEY: key.private_key}), {mode: 0o600});
          JS
          npx --no-install wrangler secret bulk "$secret_file" --config wrangler.hall-test.toml
          npx --no-install wrangler deploy --config wrangler.hall-test.toml --var "HALL_BUILD_COMMIT:$HALL_BUILD_COMMIT"
      - name: Verify public TEST identity and denied boundaries
        env:
          VITE_HALL_BOOKING_API_URL: ${{ vars.VITE_HALL_BOOKING_API_URL }}
          EXPECTED_WORKER_SHA: ${{ github.sha }}
        run: node --experimental-strip-types scripts/check-test-hall-backend.mjs
      - name: Deploy reviewed Rules, indexes, Storage rules and Hosting to TEST
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_TEST }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-service-account.json
          trap 'rm -f /tmp/firebase-service-account.json' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          node scripts/backfill-unlinked-youth-consent.mjs
          node scripts/deploy-firebase-test-with-rules-retry.mjs
      - name: Seed canonical synthetic TEST identities, families, public content and equipment
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_TEST }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/seed-population-data.mjs seed
          node scripts/seed-test-family-scenarios.mjs seed
          node scripts/seed-parent-consent-smoke.mjs seed
          node scripts/seed-public-site-content.mjs seed
          npm run seed:equipment -- --execute
          node scripts/verify-test-population.mjs
          node scripts/seed-test-family-scenarios-verifier.mjs
      - name: Verify TEST release metadata and public boundaries
        run: |
          set -euo pipefail
          node scripts/check-live-build-info.mjs
          echo "TEST email communications are disabled; no email service is required."
        env:
          SITE_URL: ${{ vars.FIREBASE_HOSTING_URL }}
          EMAIL_API_URL: ""
          FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: coolock-ardlea-scouts-test
          FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_STORAGE_ENABLED: ${{ vars.FIREBASE_STORAGE_ENABLED }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
      - name: Install pinned TEST smoke runner
        run: npm install --no-save --package-lock=false --include=optional --no-audit "@playwright/test@1.62.1" "@rolldown/binding-linux-x64-gnu@1.2.5"
      - name: Install Chromium for TEST smoke
        run: npx --no-install playwright install --with-deps chromium
      - name: Run read-only public, leader and parent TEST smoke
        env:
          CI: "true"
          E2E_STABLE_ENVIRONMENT_SMOKE: "true"
          E2E_BASE_URL: ${{ vars.FIREBASE_HOSTING_URL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: npx --no-install playwright test e2e/test-environment-smoke.spec.ts --project=chromium --project=mobile-chromium
      - name: Retain failed TEST smoke evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-smoke-failure-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Record TEST deployment evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### TEST deployment evidence'
            echo "- Actor: $GITHUB_ACTOR"
            echo "- SHA: $GITHUB_SHA"
            echo "- Target: $FIREBASE_PROJECT_ID"
            echo "- Workflow run: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
