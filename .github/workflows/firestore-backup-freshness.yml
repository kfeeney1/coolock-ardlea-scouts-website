name: Firestore Backup Freshness

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: coolock-ardlea-scouts
      BACKUP_BUCKET: gs://coolock-ardlea-scouts.firebasestorage.app
      WARNING_BACKUP_AGE_HOURS: "168"
      MAX_BACKUP_AGE_HOURS: "192"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PROJECT_ID}" != "coolock-ardlea-scouts" ]]; then
            echo "Backup freshness audit is pinned to the authoritative production project." >&2
            exit 1
          fi
          if [[ "${BACKUP_BUCKET}" != "gs://coolock-ardlea-scouts.firebasestorage.app" ]]; then
            echo "Backup freshness audit must use the authoritative production Storage bucket." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION_BACKUP }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify latest Firestore backup is recent
        id: freshness
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="${BACKUP_BUCKET%/}/firestore-backups/"
          LATEST="$(gcloud storage ls "${PREFIX}" 2>/dev/null | sed 's:/*$::' | sort | tail -n 1)"
          if [[ -z "${LATEST}" ]]; then
            echo "No Firestore backup exports were found under ${PREFIX}." >&2
            exit 1
          fi

          NAME="${LATEST##*/}"
          if [[ ! "${NAME}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$ ]]; then
            echo "Latest backup path does not use the expected timestamp format: ${LATEST}" >&2
            exit 1
          fi

          BACKUP_EPOCH="$(date -u -d "${NAME:0:10} ${NAME:11:2}:${NAME:14:2}:${NAME:17:2} UTC" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          AGE_HOURS="$(( (NOW_EPOCH - BACKUP_EPOCH) / 3600 ))"

          if (( AGE_HOURS < 0 )); then
            echo "Latest backup timestamp is in the future: ${LATEST}" >&2
            exit 1
          fi

          echo "Latest Firestore backup: ${LATEST}"
          echo "Backup age: ${AGE_HOURS} hour(s); maximum allowed: ${MAX_BACKUP_AGE_HOURS}."
          echo "latest=${LATEST}" >> "${GITHUB_OUTPUT}"
          echo "age_hours=${AGE_HOURS}" >> "${GITHUB_OUTPUT}"
          if (( AGE_HOURS > MAX_BACKUP_AGE_HOURS )); then STATE="Critical"; elif (( AGE_HOURS > WARNING_BACKUP_AGE_HOURS )); then STATE="Warning"; else STATE="Healthy"; fi
          echo "state=${STATE}" >> "${GITHUB_OUTPUT}"

          if (( AGE_HOURS > MAX_BACKUP_AGE_HOURS )); then
            echo "Firestore backup is stale. Run the Firestore Backup workflow before a release or migration." >&2
            exit 1
          fi

      - name: Publish privacy-safe monitoring observation
        if: always()
        continue-on-error: true
        shell: bash
        env:
          LATEST: ${{ steps.freshness.outputs.latest }}
          AGE_HOURS: ${{ steps.freshness.outputs.age_hours }}
          STATE: ${{ steps.freshness.outputs.state }}
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          OBSERVED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          SAFE_STATE="${STATE:-Unknown}"
          SAFE_AGE="${AGE_HOURS:-}"
          REASON="Independent scheduled backup freshness assurance"
          if [[ -z "${LATEST:-}" ]]; then
            SAFE_STATE="Missing"
            REASON="No verifiable backup reference was produced by the freshness check"
          fi
          FIELDS=$(jq -n --arg service "Firestore Backup" --arg env "PRODUCTION" --arg metric "backup freshness" --arg state "$SAFE_STATE" --arg observed "$OBSERVED_AT" --arg source "Firestore Backup Freshness GitHub Actions workflow" --arg sourceType "authoritative-live" --arg reason "$REASON" --arg recovery "Inspect Firestore Backup and Firestore Backup Freshness workflows; run a protected manual backup if required." --arg management "https://github.com/kfeeney1/coolock-ardlea-scouts-website/actions" --arg age "$SAFE_AGE" '{fields:{service:{stringValue:$service},environment:{stringValue:$env},metric:{stringValue:$metric},state:{stringValue:$state},observedAt:{stringValue:$observed},source:{stringValue:$source},sourceType:{stringValue:$sourceType},reason:{stringValue:$reason},recovery:{stringValue:$recovery},managementUrl:{stringValue:$management},current:{integerValue:(if $age=="" then "0" else $age end)},unit:{stringValue:"hours old"},warningThreshold:{integerValue:"168"},criticalThreshold:{integerValue:"192"}}}')
          curl --fail-with-body --silent --show-error -X PATCH             -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json"             --data "$FIELDS"             "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/operationalMonitoring/firestore-backup-freshness-production" >/dev/null

      - name: Write job summary
        if: always()
        shell: bash
        env:
          LATEST: ${{ steps.freshness.outputs.latest }}
          AGE_HOURS: ${{ steps.freshness.outputs.age_hours }}
        run: |
          {
            echo "## Firestore backup freshness"
            echo
            printf '%s\n' "- Project: \`${PROJECT_ID}\`"
            printf '%s\n' "- Backup bucket: \`${BACKUP_BUCKET}\`"
            printf '%s\n' "- Latest backup: \`${LATEST:-not-found}\`"
            printf '%s\n' "- Age: \`${AGE_HOURS:-unknown} hour(s)\`"
            printf '%s\n' "- Maximum allowed age: \`${MAX_BACKUP_AGE_HOURS} hours\`"
          } >> "${GITHUB_STEP_SUMMARY}"
