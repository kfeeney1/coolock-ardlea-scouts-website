name: SW-24 Security Cutover

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'sw-24-authoritative-adventure-awards' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply authoritative award cutover
        run: node scripts/apply-sw24-security-cutover.mjs
      - name: Commit non-workflow cutover
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/firebase-hosting-test.yml .github/workflows/firebase-hosting-merge.yml .github/workflows/playwright-e2e.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules scripts/check-firebase-deployment-config.mjs
          if git diff --cached --quiet; then
            echo 'No non-workflow cutover changes required.'
            exit 0
          fi
          git commit -m 'SW-24: close direct award-write bypass'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
