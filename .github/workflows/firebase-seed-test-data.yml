name: Seed Firebase Test Data

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose how to manage the live test dataset"
        required: true
        type: choice
        default: reset
        options:
          - reset
          - seed
          - cleanup
      confirm:
        description: "I understand this writes to the live Firebase project"
        required: true
        type: boolean
        default: false

jobs:
  seed-test-data:
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Firebase Admin SDK for test-data management
        run: npm install --no-save --ignore-scripts firebase-admin

      - name: Purge all marked test data
        if: ${{ inputs.action == 'reset' || inputs.action == 'cleanup' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/purge-test-data.mjs

      - name: Seed comprehensive population
        if: ${{ inputs.action == 'reset' || inputs.action == 'seed' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
          E2E_TEST_USER_PASSWORD: password1
        run: node scripts/seed-population-data.mjs seed

      - name: Seed default and Modern Scout superadmins
        if: ${{ inputs.action == 'reset' || inputs.action == 'seed' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/seed-superadmin-login.mjs

      - name: Seed canonical system-flow fixtures
        if: ${{ inputs.action == 'reset' || inputs.action == 'seed' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/seed-flow-data.mjs

      - name: Seed canonical public website content
        if: ${{ inputs.action == 'reset' || inputs.action == 'seed' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/seed-public-site-content.mjs seed

      - name: Rebuild public leadership projection from seeded database records
        if: ${{ inputs.action == 'reset' || inputs.action == 'seed' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/rebuild-public-leadership.mjs

      - name: Verify comprehensive population
        if: ${{ inputs.action == 'reset' || inputs.action == 'seed' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/verify-test-population.mjs

      - name: Verify flow fixtures
        if: ${{ inputs.action == 'reset' || inputs.action == 'seed' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/verify-flow-data.mjs

      - name: Audit live Firestore provenance
        if: ${{ inputs.action == 'reset' || inputs.action == 'seed' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/audit-live-data-provenance.mjs
