name: Rebuild Parent Weekly Programmes

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type REBUILD coolock-ardlea-scouts to rebuild production parent-safe weekly meeting projections'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-parent-weekly-rebuild
  cancel-in-progress: false

env:
  DEPLOY_ENVIRONMENT: production
  FIREBASE_PROJECT_ID: coolock-ardlea-scouts

jobs:
  rebuild:
    if: ${{ inputs.confirmation == 'REBUILD coolock-ardlea-scouts' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production credential target
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION }}
        run: node scripts/validate-firebase-environment.mjs --environment production --project "$FIREBASE_PROJECT_ID" --credential-env FIREBASE_SERVICE_ACCOUNT_JSON
      - name: Rebuild parent-safe weekly meeting projections
        run: node scripts/rebuild-parent-weekly-meetings.mjs --allow-production
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION }}
          APPLY: 'true'
          PRODUCTION_PROJECT_CONFIRMATION: coolock-ardlea-scouts
          ALLOW_PRODUCTION_MUTATION: I_UNDERSTAND
