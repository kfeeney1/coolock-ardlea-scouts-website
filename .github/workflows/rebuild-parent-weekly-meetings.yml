name: Rebuild Parent Weekly Programmes

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type REBUILD to rebuild parent-safe weekly meeting projections'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rebuild:
    if: ${{ inputs.confirmation == 'REBUILD' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild parent-safe weekly meeting projections
        run: node scripts/rebuild-parent-weekly-meetings.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
          APPLY: 'true'
