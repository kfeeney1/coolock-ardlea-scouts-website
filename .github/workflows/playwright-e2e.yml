name: Playwright E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_EMAIL_API_URL: ${{ secrets.VITE_EMAIL_API_URL }}
      VITE_FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      VITE_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      VITE_FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_TEST_USER_PASSWORD: password1
      E2E_LEADER_JOURNEY_SEEDED: "true"
      E2E_PARENT_EMAIL: test.beaver.parent1@example.com
      E2E_PARENT_LEADER_EMAIL: test.beaver.section.leader@example.com
      E2E_LEADER_EMAIL: test.scout.programme.scouter@example.com
      E2E_MULTI_SECTION_LEADER_EMAIL: test.multi.section.leader@example.com
      E2E_MULTI_SECTION_LEADER_SECTIONS: Beavers,Cubs
      E2E_ADMIN_EMAIL: test.webadmin@example.com
      E2E_SUPER_ADMIN_EMAIL: superadmin@example.com
      E2E_MODERN_SUPER_ADMIN_EMAIL: modernsuperadmin@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality

      - name: Verify Playwright seed contract
        run: node scripts/verify-playwright-seed-contract.mjs

      - name: Explain Dependabot E2E policy
        if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
        run: echo "Dependabot pull requests do not receive repository secrets. Static quality, production dependency audit, build and deterministic seed-contract checks ran above; emulator seeding and browser journeys are intentionally deferred to normal pull requests and main."

      - name: Setup Java for Firebase emulators
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install E2E Firebase tooling
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npm install --no-save --package-lock=false --include=optional firebase-admin@14.3.0 firebase-tools@15.28.1

      - name: Start Firestore, Auth and Storage emulators with branch rules
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          npx firebase emulators:start --only firestore,auth,storage --project coolock-ardlea-scouts > /tmp/firebase-emulator.log 2>&1 &
          for i in {1..45}; do
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/9099) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/9199) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/firebase-emulator.log
          exit 1

      - name: Create emulator-only Firebase Admin credential
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          node <<'NODE'
          const { generateKeyPairSync } = require("node:crypto");
          const { appendFileSync } = require("node:fs");

          const { privateKey } = generateKeyPairSync("rsa", {
            modulusLength: 2048,
            publicKeyEncoding: { type: "spki", format: "pem" },
            privateKeyEncoding: { type: "pkcs8", format: "pem" },
          });

          const credential = JSON.stringify({
            type: "service_account",
            project_id: "coolock-ardlea-scouts",
            private_key_id: "emulator-only",
            private_key: privateKey,
            client_email: "firebase-adminsdk-emulator@coolock-ardlea-scouts.iam.gserviceaccount.com",
            client_id: "000000000000000000000",
            auth_uri: "https://accounts.google.com/o/oauth2/auth",
            token_uri: "https://oauth2.googleapis.com/token",
            auth_provider_x509_cert_url: "https://www.googleapis.com/oauth2/v1/certs",
            client_x509_cert_url: "https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk-emulator%40coolock-ardlea-scouts.iam.gserviceaccount.com",
            universe_domain: "googleapis.com",
          });

          const delimiter = `FIREBASE_EMULATOR_CREDENTIAL_${Date.now()}`;
          appendFileSync(process.env.GITHUB_ENV, `FIREBASE_SERVICE_ACCOUNT_JSON<<${delimiter}\n${credential}\n${delimiter}\n`);
          NODE

      - name: Seed canonical deterministic E2E dataset
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          node scripts/seed-population-data.mjs seed
          node scripts/seed-superadmin-login.mjs
          node scripts/seed-flow-data.mjs
          node scripts/seed-public-site-content.mjs seed
          node scripts/seed-playwright-records.mjs
          node scripts/rebuild-public-leadership.mjs
          node scripts/verify-test-population.mjs
          node scripts/verify-flow-data.mjs

      - name: Prove canonical seed is safe when existing data remains
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          echo "Re-seeding the same emulator without cleanup to prove deterministic seed idempotency."
          node scripts/seed-population-data.mjs seed
          node scripts/seed-superadmin-login.mjs
          node scripts/seed-flow-data.mjs
          node scripts/seed-public-site-content.mjs seed
          node scripts/seed-playwright-records.mjs
          node scripts/rebuild-public-leadership.mjs
          node scripts/verify-test-population.mjs
          node scripts/verify-flow-data.mjs

      - name: Install pinned Playwright test runner
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npm install --no-save --package-lock=false --include=optional "@playwright/test@1.62.1" "@rolldown/binding-linux-x64-gnu@1.2.5"

      - name: Report Playwright version
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npx --no-install playwright --version

      - name: Install Chromium and WebKit
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Start tested build
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: List discovered Playwright tests
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npx --no-install playwright test --list

      - name: Run Playwright tests
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npm run test:e2e

      - name: Collect E2E service logs on failure
        if: ${{ failure() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') }}
        run: |
          mkdir -p e2e-debug
          cp /tmp/firebase-emulator.log e2e-debug/firebase-emulator.log 2>/dev/null || true
          cp /tmp/vite-preview.log e2e-debug/vite-preview.log 2>/dev/null || true
          echo "===== Firebase emulator log ====="
          cat /tmp/firebase-emulator.log || true
          echo "===== Vite preview log ====="
          cat /tmp/vite-preview.log || true

      - name: Upload Playwright report
        if: ${{ always() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: ${{ failure() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: |
            test-results/
            e2e-debug/
          retention-days: 14
          if-no-files-found: ignore
