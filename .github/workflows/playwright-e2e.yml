name: Playwright E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused_pr:
    name: Focused PR assurance
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      VITE_APP_ENV: local
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-coolock-ardlea-scouts.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-coolock-ardlea-scouts
      VITE_FIREBASE_STORAGE_BUCKET: demo-coolock-ardlea-scouts.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: 1:000000000000:web:local
      VITE_EMAIL_API_URL: http://127.0.0.1:8787
      VITE_FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      VITE_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      VITE_FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      FIREBASE_PROJECT_ID: demo-coolock-ardlea-scouts
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_TEST_USER_PASSWORD: password1
      E2E_DEPLOYMENT_SMOKE_CONTRACT: 'true'
      E2E_LEADER_JOURNEY_SEEDED: 'true'
      E2E_PARENT_EMAIL: test.beaver.parent1@example.com
      E2E_PARENT_LEADER_EMAIL: test.beaver.section.leader@example.com
      E2E_LEADER_EMAIL: test.scout.programme.scouter@example.com
      E2E_MULTI_SECTION_LEADER_EMAIL: test.multi.section.leader@example.com
      E2E_GROUP_YOUTH_CHAMPION_EMAIL: test.multi.section.group.youth.champion@example.com
      E2E_MULTI_SECTION_LEADER_SECTIONS: Beavers,Cubs
      E2E_ADMIN_EMAIL: test.webadmin@example.com
      E2E_SUPER_ADMIN_EMAIL: superadmin@example.com
      E2E_MODERN_SUPER_ADMIN_EMAIL: modernsuperadmin@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false --include=optional --no-audit firebase-admin@14.3.0 firebase-tools@15.28.1 "@playwright/test@1.62.1" "@rolldown/binding-linux-x64-gnu@1.2.5"
      - name: Start emulators
        run: |
          npx firebase emulators:start --only firestore,auth,storage --project "$FIREBASE_PROJECT_ID" > /tmp/firebase-emulator.log 2>&1 &
          for i in {1..45}; do if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/9099) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/9199) 2>/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/firebase-emulator.log; exit 1
      - name: Create emulator credential
        run: |
          node <<'NODE'
          const {generateKeyPairSync}=require("node:crypto"); const {writeFileSync,appendFileSync}=require("node:fs");
          const {privateKey}=generateKeyPairSync("rsa",{modulusLength:2048,publicKeyEncoding:{type:"spki",format:"pem"},privateKeyEncoding:{type:"pkcs8",format:"pem"}});
          const projectId=process.env.FIREBASE_PROJECT_ID,path="/tmp/firebase-emulator-credential.json";
          writeFileSync(path,JSON.stringify({type:"service_account",project_id:projectId,private_key_id:"emulator-only",private_key:privateKey,client_email:`firebase-adminsdk-emulator@${projectId}.iam.gserviceaccount.com`,client_id:"000000000000000000000",auth_uri:"https://accounts.google.com/o/oauth2/auth",token_uri:"https://oauth2.googleapis.com/token"}),{mode:0o600}); appendFileSync(process.env.GITHUB_ENV,`GOOGLE_APPLICATION_CREDENTIALS=${path}\n`);
          NODE
      - name: Seed focused dataset
        run: |
          node scripts/seed-population-data.mjs seed
          node scripts/seed-superadmin-login.mjs
          node scripts/seed-flow-data.mjs
          node scripts/seed-public-site-content.mjs seed
          node scripts/seed-playwright-records.mjs
          node scripts/rebuild-public-leadership.mjs
      - name: Start tested build
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do if curl --fail --silent "$E2E_BASE_URL"/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/vite-preview.log; exit 1
      - name: Run focused SW-170 tests
        run: npx --no-install playwright test e2e/event-record-page.spec.ts e2e/weekly-record-integrity.spec.ts --project=chromium --retries=0 --timeout=30000
      - name: Repeat isolated SW-355 lifecycle on persistent emulator state
        run: npx --no-install playwright test e2e/weekly-section-tracker.spec.ts --project=chromium --retries=0 --repeat-each=2 --timeout=30000 --grep "section leader completes lifecycle with flexible planner rows, summary and retained save state"
      - name: Run SW-317 signed-out route alone on desktop and mobile
        run: npx --no-install playwright test e2e/leader-communications.spec.ts --project=chromium --project=mobile-chromium --retries=0 --timeout=30000 --grep "communications route rejects unauthenticated users after authenticated journeys"
      - name: Run SW-317 communications suite after authenticated journeys
        run: npx --no-install playwright test e2e/leader-communications.spec.ts --project=chromium --project=mobile-chromium --retries=0 --timeout=30000
      - name: Run focused blocking regressions
        run: npx --no-install playwright test e2e/programme-library.spec.ts e2e/weekly-section-tracker.spec.ts --project=chromium --retries=0 --timeout=30000 --grep "leader can save, insert and remove a reusable programme activity|group leader copies a meeting into another authorised section and resets operational history"

  e2e_shard:
    name: e2e shard ${{ matrix.id }} of 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            shard: 1/2
          - id: 2
            shard: 2/2
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VITE_APP_ENV: local
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-coolock-ardlea-scouts.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-coolock-ardlea-scouts
      VITE_FIREBASE_STORAGE_BUCKET: demo-coolock-ardlea-scouts.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: 1:000000000000:web:local
      VITE_EMAIL_API_URL: http://127.0.0.1:8787
      VITE_FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      VITE_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      VITE_FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      FIREBASE_PROJECT_ID: demo-coolock-ardlea-scouts
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_TEST_USER_PASSWORD: password1
      E2E_DEPLOYMENT_SMOKE_CONTRACT: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      E2E_LEADER_JOURNEY_SEEDED: 'true'
      E2E_PARENT_EMAIL: test.beaver.parent1@example.com
      E2E_PARENT_LEADER_EMAIL: test.beaver.section.leader@example.com
      E2E_LEADER_EMAIL: test.scout.programme.scouter@example.com
      E2E_MULTI_SECTION_LEADER_EMAIL: test.multi.section.leader@example.com
      E2E_MULTI_SECTION_LEADER_SECTIONS: Beavers,Cubs
      E2E_ADMIN_EMAIL: test.webadmin@example.com
      E2E_SUPER_ADMIN_EMAIL: superadmin@example.com
      E2E_MODERN_SUPER_ADMIN_EMAIL: modernsuperadmin@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci --no-audit

      - name: Build tested application
        run: npm run build

      - name: Verify Playwright seed contract
        run: node scripts/verify-playwright-seed-contract.mjs

      - name: Explain Dependabot E2E policy
        if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
        run: echo "Dependabot pull requests receive no Firebase or email credentials. Static quality and deterministic seed-contract checks ran above; emulator browser journeys are deferred to normal pull requests and main."

      - name: Setup Java for Firebase emulators
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install E2E Firebase tooling
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npm install --no-save --package-lock=false --include=optional --no-audit firebase-admin@14.3.0 firebase-tools@15.28.1

      - name: Start Firestore, Auth and Storage emulators with branch rules
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          npx firebase emulators:start --only firestore,auth,storage --project "$FIREBASE_PROJECT_ID" > /tmp/firebase-emulator.log 2>&1 &
          for i in {1..45}; do
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/9099) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/9199) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/firebase-emulator.log
          exit 1

      - name: Create emulator-only Firebase Admin credential
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          node <<'NODE'
          const { generateKeyPairSync } = require("node:crypto");
          const { writeFileSync, appendFileSync } = require("node:fs");
          const { privateKey } = generateKeyPairSync("rsa", { modulusLength: 2048, publicKeyEncoding: { type: "spki", format: "pem" }, privateKeyEncoding: { type: "pkcs8", format: "pem" } });
          const projectId = process.env.FIREBASE_PROJECT_ID;
          const path = "/tmp/firebase-emulator-credential.json";
          writeFileSync(path, JSON.stringify({ type:"service_account", project_id:projectId, private_key_id:"emulator-only", private_key:privateKey, client_email:`firebase-adminsdk-emulator@${projectId}.iam.gserviceaccount.com`, client_id:"000000000000000000000", auth_uri:"https://accounts.google.com/o/oauth2/auth", token_uri:"https://oauth2.googleapis.com/token", auth_provider_x509_cert_url:"https://www.googleapis.com/oauth2/v1/certs", client_x509_cert_url:"https://example.invalid/emulator-only", universe_domain:"googleapis.com" }), { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${path}\n`);
          NODE

      - name: Seed canonical deterministic E2E dataset
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          node scripts/seed-population-data.mjs seed
          node scripts/seed-superadmin-login.mjs
          node scripts/seed-flow-data.mjs
          node scripts/seed-public-site-content.mjs seed
          node scripts/seed-playwright-records.mjs
          node scripts/rebuild-public-leadership.mjs
          node scripts/verify-test-population.mjs
          node scripts/verify-flow-data.mjs

      - name: Prove canonical seed is safe when existing data remains
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          node scripts/seed-population-data.mjs seed
          node scripts/seed-superadmin-login.mjs
          node scripts/seed-flow-data.mjs
          node scripts/seed-public-site-content.mjs seed
          node scripts/seed-playwright-records.mjs
          node scripts/rebuild-public-leadership.mjs
          node scripts/verify-test-population.mjs
          node scripts/verify-flow-data.mjs

      - name: Install pinned Playwright test runner
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npm install --no-save --package-lock=false --include=optional --no-audit "@playwright/test@1.62.1" "@rolldown/binding-linux-x64-gnu@1.2.5"

      - name: Report Playwright version
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npx --no-install playwright --version

      - name: Verify preinstalled Playwright browsers launch
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium, webkit } from "@playwright/test";
          for (const browserType of [chromium, webkit]) {
            const browser = await browserType.launch({ headless: true });
            await browser.close();
          }
          NODE

      - name: Start tested build
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent "$E2E_BASE_URL"/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: List discovered Playwright tests
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npx --no-install playwright test --list

      - name: Run Playwright tests
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:e2e:pr -- --base "${{ github.event.pull_request.base.sha }}" --shard "${{ matrix.shard }}"
          else
            npm run test:e2e:full -- --shard "${{ matrix.shard }}"
          fi

      - name: Collect E2E service logs on failure
        if: ${{ failure() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') }}
        run: |
          mkdir -p e2e-debug
          cp /tmp/firebase-emulator.log e2e-debug/firebase-emulator.log 2>/dev/null || true
          cp /tmp/vite-preview.log e2e-debug/vite-preview.log 2>/dev/null || true
          cat /tmp/firebase-emulator.log || true
          cat /tmp/vite-preview.log || true

      - name: Upload Playwright report
        if: ${{ always() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: ${{ failure() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results-shard-${{ matrix.id }}
          path: |
            test-results/
            e2e-debug/
          retention-days: 14
          if-no-files-found: ignore

  # Preserve the repository-protected check name while the browser workload runs
  # in isolated runners. Each shard owns its own emulator dataset, so this reduces
  # wall time without introducing shared-state parallelism inside Playwright.
  e2e:
    if: ${{ always() }}
    needs: e2e_shard
    runs-on: ubuntu-latest
    steps:
      - name: Require every Playwright shard
        shell: bash
        run: |
          if [ "${{ needs.e2e_shard.result }}" != "success" ]; then
            echo "::error::One or more Playwright shards failed or were cancelled."
            exit 1
          fi
          echo "All Playwright shards passed."
