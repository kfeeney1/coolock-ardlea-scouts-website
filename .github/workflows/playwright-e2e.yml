name: Playwright E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_EMAIL_API_URL: ${{ secrets.VITE_EMAIL_API_URL }}
      VITE_FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      VITE_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_TEST_USER_PASSWORD: password1
      E2E_PARENT_EVENT_CONSENT_ENABLED: ${{ vars.E2E_PARENT_EVENT_CONSENT_ENABLED }}
      E2E_LEADER_JOURNEY_SEEDED: "true"
      E2E_PARENT_EMAIL: test.beaver.parent1@example.com
      E2E_PARENT_LEADER_EMAIL: test.beaver.section.leader@example.com
      E2E_LEADER_EMAIL: test.scout.programme.scouter@example.com
      E2E_MULTI_SECTION_LEADER_EMAIL: test.multi.section.leader@example.com
      E2E_MULTI_SECTION_LEADER_SECTIONS: Beavers,Cubs
      E2E_ADMIN_EMAIL: test.webadmin@example.com
      E2E_SUPER_ADMIN_EMAIL: superadmin@example.com
      PLAYWRIGHT_TEST_VERSION: "1.62.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality

      - name: Verify Playwright seed contract
        run: node scripts/verify-playwright-seed-contract.mjs

      - name: Explain Dependabot E2E policy
        if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
        run: echo "Dependabot pull requests do not receive repository secrets. Static quality, production dependency audit, build and deterministic seed-contract checks ran above; credentialed emulator seeding and browser journeys are intentionally deferred to normal pull requests and main."

      - name: Setup Java for Firebase emulators
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install E2E Firebase tooling
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npm install --no-save --package-lock=false firebase-admin firebase-tools@15.28.1

      - name: Start Firestore and Auth emulators with branch rules
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          npx firebase emulators:start --only firestore,auth --project coolock-ardlea-scouts > /tmp/firebase-emulator.log 2>&1 &
          for i in {1..45}; do
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/9099) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/firebase-emulator.log
          exit 1

      - name: Seed canonical deterministic E2E dataset
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: |
          node scripts/seed-population-data.mjs seed
          node scripts/seed-flow-data.mjs
          node scripts/seed-public-site-content.mjs seed
          node scripts/seed-playwright-records.mjs
          node scripts/rebuild-public-leadership.mjs
          node scripts/verify-test-population.mjs
          node scripts/verify-flow-data.mjs

      - name: Prove canonical seed is safe when existing data remains
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: |
          echo "Re-seeding the same emulator without cleanup to prove deterministic seed idempotency."
          node scripts/seed-population-data.mjs seed
          node scripts/seed-flow-data.mjs
          node scripts/seed-public-site-content.mjs seed
          node scripts/seed-playwright-records.mjs
          node scripts/rebuild-public-leadership.mjs
          node scripts/verify-test-population.mjs
          node scripts/verify-flow-data.mjs

      - name: Install pinned Playwright test runner
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npm install --no-save --package-lock=false "@playwright/test@${PLAYWRIGHT_TEST_VERSION}"

      - name: Report Playwright version
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npx --no-install playwright --version

      - name: Install Chromium
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npx --no-install playwright install --with-deps chromium

      - name: Start tested build
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Run Playwright tests
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: ${{ failure() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
