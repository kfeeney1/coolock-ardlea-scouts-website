name: Post-deploy smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/check-live-deployment.mjs"
      - ".github/workflows/post-deploy-smoke.yml"
      - ".github/workflows/firebase-hosting-merge.yml"
      - ".github/workflows/firestore-rules.yml"
      - "src/services/publicWhosWho.ts"
      - "firestore.rules"
  workflow_run:
    workflows:
      - Deploy to Firebase Hosting on merge
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify live site and Firebase services
        run: npm run smoke:live
        env:
          SITE_URL: https://coolock-ardlea-scouts.web.app
          EMAIL_API_URL: ${{ secrets.VITE_EMAIL_API_URL }}
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: coolock-ardlea-scouts
          FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_STORAGE_ENABLED: ${{ vars.FIREBASE_STORAGE_ENABLED }}
          EXPECTED_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          ALLOW_FIRESTORE_ONLY_DEPLOY_PENDING_WARNING: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
