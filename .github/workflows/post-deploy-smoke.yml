name: PRODUCTION Read-only Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCTION_URL: https://coolockardleascouts.ie

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify deployed release evidence on custom domain
        run: node scripts/check-live-build-info.mjs
        env:
          SITE_URL: ${{ env.PRODUCTION_URL }}

      - name: Verify production site and public Firebase boundaries on custom domain
        run: npm run smoke:live
        env:
          SITE_URL: ${{ env.PRODUCTION_URL }}
          EMAIL_API_URL: ${{ vars.VITE_EMAIL_API_URL }}
          FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: coolock-ardlea-scouts
          FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_STORAGE_ENABLED: ${{ vars.FIREBASE_STORAGE_ENABLED }}
