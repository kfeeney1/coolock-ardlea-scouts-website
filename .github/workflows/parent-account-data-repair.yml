name: Parent Account Compatibility Repair

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/repair-parent-account-linked-sections.mjs"
      - ".github/workflows/parent-account-data-repair.yml"

permissions:
  contents: read

jobs:
  repair:
    if: ${{ github.head_ref == 'chore/extend-firestore-compatibility-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Firebase Admin
        run: npm install --no-save --package-lock=false firebase-admin@14.3.0
      - name: Repair confirmed stale parent linked sections
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/repair-parent-account-linked-sections.mjs
