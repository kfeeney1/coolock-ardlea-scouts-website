name: Post-merge CI Guard

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Firebase TEST Deploy"]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: post-merge-ci-guard
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve main SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            TARGET_SHA="${WORKFLOW_RUN_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TARGET_SHA="${GITHUB_SHA}"
          else
            TARGET_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          fi
          test -n "${TARGET_SHA}"
          echo "sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Guarding post-merge evidence for ${TARGET_SHA}"

      - name: Checkout guarded SHA for exact-check state calculation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Require exact-SHA post-merge evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/post-merge-ci-evidence.mjs --wait --timeout-seconds 1800 --missing-grace-seconds 180 --poll-interval-seconds 30

      - name: Record guarded SHA
        if: always()
        run: |
          {
            echo "### Post-merge CI guard"
            echo "- SHA: ${{ steps.target.outputs.sha }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Required workflows: Quality, Playwright E2E, Firebase TEST Deploy"
            echo "- Required checks: quality, e2e, deploy_test"
          } >> "${GITHUB_STEP_SUMMARY}"
