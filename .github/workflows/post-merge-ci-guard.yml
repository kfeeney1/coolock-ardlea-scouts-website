name: Post-merge CI Guard

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Firebase TEST Deploy"]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: post-merge-ci-guard
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve main SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            TARGET_SHA="${WORKFLOW_RUN_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TARGET_SHA="${GITHUB_SHA}"
          else
            TARGET_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          fi
          test -n "${TARGET_SHA}"
          echo "sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Guarding post-merge evidence for ${TARGET_SHA}"

      - name: Require exact-SHA post-merge evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2100))
          required_workflows=("Quality" "Playwright E2E" "Firebase TEST Deploy")
          required_checks=("quality" "e2e" "deploy_test")

          while (( SECONDS < deadline )); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100")"
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100")"
            waiting=0

            for workflow in "${required_workflows[@]}"; do
              state="$(jq -r --arg workflow "${workflow}" '
                [.workflow_runs[] | select(.name == $workflow and .event == "push")]
                | sort_by(.id) | last
                | if . == null then "missing"
                  elif .status != "completed" then .status
                  else .conclusion end
              ' <<<"${runs}")"
              echo "workflow ${workflow}: ${state}"
              case "${state}" in
                success) ;;
                missing|queued|in_progress|waiting|requested|pending) waiting=1 ;;
                *) echo "::error::Post-merge workflow ${workflow} is ${state} for ${TARGET_SHA}."; exit 1 ;;
              esac
            done

            for check in "${required_checks[@]}"; do
              state="$(jq -r --arg check "${check}" '
                [.check_runs[] | select(.name == $check)]
                | sort_by(.id) | last
                | if . == null then "missing"
                  elif .status != "completed" then .status
                  else .conclusion end
              ' <<<"${checks}")"
              echo "check ${check}: ${state}"
              case "${state}" in
                success) ;;
                missing|queued|in_progress|waiting|requested|pending) waiting=1 ;;
                *) echo "::error::Required exact-SHA check ${check} is ${state} for ${TARGET_SHA}."; exit 1 ;;
              esac
            done

            if [[ "${waiting}" -eq 0 ]]; then
              echo "All required post-merge workflows and exact-SHA checks succeeded for ${TARGET_SHA}."
              exit 0
            fi

            echo "Post-merge evidence is incomplete; checking again in 30 seconds."
            sleep 30
          done

          echo "::error::Timed out waiting for Quality, Playwright E2E and Firebase TEST Deploy evidence on ${TARGET_SHA}. A required post-merge workflow may not have started."
          exit 1

      - name: Record guarded SHA
        if: always()
        run: |
          {
            echo "### Post-merge CI guard"
            echo "- SHA: ${{ steps.target.outputs.sha }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Required workflows: Quality, Playwright E2E, Firebase TEST Deploy"
            echo "- Required checks: quality, e2e, deploy_test"
          } >> "${GITHUB_STEP_SUMMARY}"
