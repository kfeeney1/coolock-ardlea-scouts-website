name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_APP_ENV: local
      VITE_FIREBASE_PROJECT_ID: demo-coolock-ardlea-scouts
      VITE_FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      VITE_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      VITE_FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit
          npm --prefix functions install --no-audit --package-lock=false

      - name: Audit production dependencies
        run: |
          for attempt in 1 2; do
            if timeout 180s npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "::warning::Production dependency audit attempt $attempt failed or timed out; retrying once after 15 seconds."
              sleep 15
            fi
          done
          echo "::error::Production dependency audit did not complete successfully after two bounded attempts."
          exit 1

      - name: Verify normal CI is isolated from production configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${VITE_APP_ENV}" != "local" || "${VITE_FIREBASE_PROJECT_ID}" != demo-* ]]; then
            echo "::error::Quality CI must use only the local/demo Firebase identity."
            exit 1
          fi
          if env | grep -Eq '^(FIREBASE_SERVICE_ACCOUNT_JSON|VITE_EMAIL_API_URL)='; then
            echo "::error::Normal Quality CI must not receive Firebase service-account or email-delivery configuration."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          for test_file in tests/unit/*.test.ts; do
            output_file="$(mktemp)"
            if ! node --experimental-strip-types --test "$test_file" >"$output_file" 2>&1; then
              escaped="$(tail -n 60 "$output_file" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
              echo "::error file=${test_file}::${escaped}"
              cat "$output_file"
              rm -f "$output_file"
              exit 1
            fi
            rm -f "$output_file"
          done

      - name: Email worker tests
        run: npm run test:email-worker

      - name: Adventure Functions tests
        run: npm run test:adventure-functions

      - name: Adventure Functions checks
        run: npm run check:adventure-functions

      - name: Seed contract
        run: npm run check:seed-contract

      - name: Playwright suite contract
        run: npm run check:playwright-suite

      - name: Dropdown implementation
        run: npm run check:dropdown-implementation

      - name: Source complexity
        run: npm run check:source-complexity

      - name: Hosting configuration
        run: npm run check:hosting-config

      - name: Firebase deployment configuration
        run: npm run check:firebase-deploy-config

      - name: Firestore audit coverage
        run: npm run check:firestore-audit-coverage

      - name: RBAC matrix
        run: npm run check:rbac-matrix

      - name: RBAC test coverage
        run: npm run check:rbac-test-coverage

      - name: Workflow permissions
        run: npm run check:workflow-permissions

      - name: Workflow action pinning
        run: npm run check:workflow-action-pinning

      - name: Workflow production credentials
        run: npm run check:workflow-production-credentials

      - name: Smoke script syntax
        run: npm run check:smoke-script

      - name: Build
        run: npm run build
