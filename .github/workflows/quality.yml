name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Audit production dependencies
        run: |
          for attempt in 1 2; do
            if timeout 180s npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "::warning::Production dependency audit attempt $attempt failed or timed out; retrying once after 15 seconds."
              sleep 15
            fi
          done
          echo "::error::Production dependency audit did not complete successfully after two bounded attempts."
          exit 1

      - name: Explain Dependabot production-config policy
        if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
        run: echo "Dependabot pull requests do not receive repository secrets, so production environment validation is intentionally deferred. The install, production dependency audit, lint, unit tests, seed contract, hosting config and production build still run in this job."

      - name: Validate production configuration
        if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
        run: npm run check:production-env
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_EMAIL_API_URL: ${{ secrets.VITE_EMAIL_API_URL }}

      - name: Run quality gate
        run: npm run quality:checks
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_EMAIL_API_URL: ${{ secrets.VITE_EMAIL_API_URL }}
