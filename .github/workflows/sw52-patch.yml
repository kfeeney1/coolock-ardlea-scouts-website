name: SW-52 guarded patch

on:
  push:
    branches: [sw-52-open-ended-subs-rates]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sw-52-open-ended-subs-rates

      - name: Apply SW-52 implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/services/subsLogic.ts')
          s = p.read_text()
          old = '''export function familyTotalFor(policy: SubsRatePolicy, type: SubsFamilyType, childCount: number): number {
            const rates = familyRatesFor(policy, type);
            if (!Number.isInteger(childCount) || childCount < 1 || childCount > rates.length) {
              throw new Error(`${familyTypeLabel(type)} supports between 1 and ${rates.length} children for this policy.`);
            }
            return rates[childCount - 1];
          }'''
          new = '''export function familyTotalFor(policy: SubsRatePolicy, type: SubsFamilyType, childCount: number): number {
            const rates = familyRatesFor(policy, type);
            if (!Number.isInteger(childCount) || childCount < 1) {
              throw new Error("Family child count must be a positive integer.");
            }
            if (childCount > rates.length) {
              throw new Error(`Rate not configured for ${childCount} children in this ${familyTypeLabel(type).toLowerCase()}.`);
            }
            return rates[childCount - 1];
          }'''
          if old not in s:
              raise SystemExit('subsLogic familyTotalFor block changed')
          p.write_text(s.replace(old, new))

          p = Path('src/components/admin/SubsSettingsPanel.tsx')
          s = p.read_text()
          marker = '''  const setRate = (type: "standard" | "leader", index: number, value: string) => {
            const setter = type === "standard" ? setStandardRates : setLeaderRates;
            setter((current) => current.map((entry, currentIndex) => currentIndex === index ? value : entry));
            setMessage("");
            setError("");
          };
'''
          replacement = marker + '''\n  const addRate = (type: "standard" | "leader") => {
            const setter = type === "standard" ? setStandardRates : setLeaderRates;
            setter((current) => [...current, ""]);
            setMessage("");
            setError("");
          };

          const removeLastRate = (type: "standard" | "leader") => {
            const setter = type === "standard" ? setStandardRates : setLeaderRates;
            setter((current) => current.length > 1 ? current.slice(0, -1) : current);
            setMessage("");
            setError("");
          };
'''
          if marker not in s:
              raise SystemExit('settings setRate block changed')
          s = s.replace(marker, replacement)
          s = s.replace('''        <Box sx={{ display: "grid", gridTemplateColumns: { xs: "1fr 1fr", md: "repeat(4, 1fr)" }, gap: 2 }}>
          {standardRates.map((value, index) => (
            <TextField key={`standard-${index}`} label={`${index + 1} child${index ? "ren" : ""} (EUR)`} value={value} onChange={(event) => setRate("standard", index, event.target.value)} />
          ))}
        </Box>
''', '''        <Box sx={{ display: "grid", gridTemplateColumns: { xs: "1fr", sm: "repeat(2, 1fr)", md: "repeat(4, 1fr)" }, gap: 2 }}>
          {standardRates.map((value, index) => (
            <TextField key={`standard-${index}`} data-testid={`subs-standard-rate-${index + 1}`} label={`${index + 1} child${index ? "ren" : ""} (EUR)`} value={value} onChange={(event) => setRate("standard", index, event.target.value)} />
          ))}
        </Box>
        <Stack direction={{ xs: "column", sm: "row" }} spacing={1} sx={{ mt: 1.5 }}>
          <Button variant="outlined" onClick={() => addRate("standard")} data-testid="subs-add-standard-rate">Add standard child rate</Button>
          <Button variant="text" disabled={standardRates.length <= 1} onClick={() => removeLastRate("standard")}>Remove last standard rate</Button>
        </Stack>
''')
          s = s.replace('''        <Box sx={{ display: "grid", gridTemplateColumns: { xs: "1fr", sm: "repeat(3, 1fr)" }, gap: 2 }}>
          {leaderRates.map((value, index) => (
            <TextField key={`leader-${index}`} label={`${index + 1} child${index ? "ren" : ""} (EUR)`} value={value} onChange={(event) => setRate("leader", index, event.target.value)} />
          ))}
        </Box>
''', '''        <Box sx={{ display: "grid", gridTemplateColumns: { xs: "1fr", sm: "repeat(2, 1fr)", md: "repeat(3, 1fr)" }, gap: 2 }}>
          {leaderRates.map((value, index) => (
            <TextField key={`leader-${index}`} data-testid={`subs-leader-rate-${index + 1}`} label={`${index + 1} child${index ? "ren" : ""} (EUR)`} value={value} onChange={(event) => setRate("leader", index, event.target.value)} />
          ))}
        </Box>
        <Stack direction={{ xs: "column", sm: "row" }} spacing={1} sx={{ mt: 1.5 }}>
          <Button variant="outlined" onClick={() => addRate("leader")} data-testid="subs-add-leader-rate">Add leader child rate</Button>
          <Button variant="text" disabled={leaderRates.length <= 1} onClick={() => removeLastRate("leader")}>Remove last leader rate</Button>
        </Stack>
        <Alert severity="warning" sx={{ mt: 2 }}>
          If a family has more active children than this policy defines, no amount is inferred. Add the exact approved family-size rate before classifying or billing that family.
        </Alert>
''')
          p.write_text(s)

          p = Path('firestore.rules')
          s = p.read_text()
          s = s.replace('''        && request.resource.data.standardFamilyRatesCents is list
        && request.resource.data.standardFamilyRatesCents.size() == 4
        && request.resource.data.standardFamilyRatesCents[0] is number && request.resource.data.standardFamilyRatesCents[0] >= 0
        && request.resource.data.standardFamilyRatesCents[1] is number && request.resource.data.standardFamilyRatesCents[1] >= request.resource.data.standardFamilyRatesCents[0]
        && request.resource.data.standardFamilyRatesCents[2] is number && request.resource.data.standardFamilyRatesCents[2] >= request.resource.data.standardFamilyRatesCents[1]
        && request.resource.data.standardFamilyRatesCents[3] is number && request.resource.data.standardFamilyRatesCents[3] >= request.resource.data.standardFamilyRatesCents[2]
        && request.resource.data.leaderFamilyRatesCents is list
        && request.resource.data.leaderFamilyRatesCents.size() == 3
        && request.resource.data.leaderFamilyRatesCents[0] is number && request.resource.data.leaderFamilyRatesCents[0] >= 0
        && request.resource.data.leaderFamilyRatesCents[1] is number && request.resource.data.leaderFamilyRatesCents[1] >= request.resource.data.leaderFamilyRatesCents[0]
        && request.resource.data.leaderFamilyRatesCents[2] is number && request.resource.data.leaderFamilyRatesCents[2] >= request.resource.data.leaderFamilyRatesCents[1]
''', '''        && request.resource.data.standardFamilyRatesCents is list
        && request.resource.data.standardFamilyRatesCents.size() >= 1
        && request.resource.data.standardFamilyRatesCents[0] is number && request.resource.data.standardFamilyRatesCents[0] >= 0
        && request.resource.data.leaderFamilyRatesCents is list
        && request.resource.data.leaderFamilyRatesCents.size() >= 1
        && request.resource.data.leaderFamilyRatesCents[0] is number && request.resource.data.leaderFamilyRatesCents[0] >= 0
''')
          start = s.index('''      function isValidFamilyAssignment(policy) {''')
          end = s.index('''      allow get, list: if isActiveLeader()''', start)
          new_fn = '''      function isValidFamilyIncrement(rates, position, amount) {
        return rates is list
          && position is number
          && position >= 1
          && position <= rates.size()
          && rates[position - 1] is number
          && rates[position - 1] >= 0
          && ((position == 1 && amount == rates[0])
            || (position > 1
              && rates[position - 2] is number
              && rates[position - 2] >= 0
              && rates[position - 1] >= rates[position - 2]
              && amount == rates[position - 1] - rates[position - 2]));
      }
      function isValidFamilyAssignment(policy) {
        return request.resource.data.familyType in ["standard", "leader"]
          && request.resource.data.familyPosition is number
          && request.resource.data.familyPosition >= 1
          && ((request.resource.data.familyType == "standard"
              && request.resource.data.leaderChild == false
              && request.resource.data.sibling == (request.resource.data.familyPosition > 1)
              && request.resource.data.category == (request.resource.data.familyPosition > 1 ? "sibling" : "standard")
              && isValidFamilyIncrement(policy.standardFamilyRatesCents, request.resource.data.familyPosition, request.resource.data.amountDueCents))
            || (request.resource.data.familyType == "leader"
              && request.resource.data.leaderChild == true
              && request.resource.data.sibling == (request.resource.data.familyPosition > 1)
              && request.resource.data.category == "leader-child"
              && isValidFamilyIncrement(policy.leaderFamilyRatesCents, request.resource.data.familyPosition, request.resource.data.amountDueCents)));
      }
'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)

          p = Path('tests/unit/subsLogic.test.ts')
          s = p.read_text()
          anchor = '''test("parses euro amounts into integer cents without floating point storage",()=>{'''
          addition = '''test("family rate tables support additional configured child counts and fail explicitly when missing",()=>{
 const expanded={...policy,standardFamilyRatesCents:[26400,41900,52400,62900,73400],leaderFamilyRatesCents:[20500,34300,46500,57000]};
 assert.equal(familyTotalFor(expanded,"standard",5),73400);
 assert.equal(familyIncrementFor(expanded,"standard",5),10500);
 assert.equal(familyTotalFor(expanded,"leader",4),57000);
 assert.equal(familyIncrementFor(expanded,"leader",4),10500);
 assert.throws(()=>familyTotalFor(policy,"standard",5),/Rate not configured/);
 assert.throws(()=>familyTotalFor(policy,"leader",4),/Rate not configured/);
});
'''
          if anchor not in s:
              raise SystemExit('unit test anchor changed')
          p.write_text(s.replace(anchor, addition + anchor))

          p = Path('tests/firestore/subs.rules.test.mjs')
          s = p.read_text()
          old_test = '''test("policies reject malformed family totals",async()=>{
 await seed([["adminUsers/admin",{active:true,role:"admin",sections:["Group"]}]]);
 const db=env.authenticatedContext("admin").firestore();
 await assertFails(setDoc(doc(db,"subsRatePolicies/bad-count"),{...policy("admin"),standardFamilyRatesCents:[26400,41900,52400]}));
 await assertFails(setDoc(doc(db,"subsRatePolicies/decreasing"),{...policy("admin"),leaderFamilyRatesCents:[20500,19000,46500]}));
 await assertFails(setDoc(doc(db,"subsRatePolicies/mismatched-first"),{...policy("admin"),standardCents:1}));
});'''
          new_test = '''test("policies accept additional child counts and reject unusable table roots",async()=>{
 await seed([["adminUsers/admin",{active:true,role:"admin",sections:["Group"]}],["members/m1",member()]]);
 const db=env.authenticatedContext("admin").firestore();
 const expanded={...policy("admin"),standardFamilyRatesCents:[26400,41900,52400,62900,73400],leaderFamilyRatesCents:[20500,34300,46500,57000]};
 await assertSucceeds(setDoc(doc(db,"subsRatePolicies/expanded"),expanded));
 await assertFails(setDoc(doc(db,"subsRatePolicies/empty-standard"),{...policy("admin"),standardFamilyRatesCents:[]}));
 await assertFails(setDoc(doc(db,"subsRatePolicies/empty-leader"),{...policy("admin"),leaderFamilyRatesCents:[]}));
 await assertFails(setDoc(doc(db,"subsRatePolicies/mismatched-first"),{...policy("admin"),standardCents:1}));
 const assignment={memberId:"m1",memberName:"Member One",section:"Cubs",period:"2026/27",category:"sibling",amountDueCents:10500,policyId:"expanded",policyVersion:1,sibling:true,leaderChild:false,familyType:"standard",familyPosition:5,classifiedBy:"admin",createdAt:serverTimestamp()};
 await assertSucceeds(setDoc(doc(db,"subsAssignments/fifth-child"),assignment));
 await assertFails(setDoc(doc(db,"subsAssignments/sixth-child"),{...assignment,familyPosition:6}));
});'''
          if old_test not in s:
              raise SystemExit('rules test block changed')
          p.write_text(s.replace(old_test, new_test))

          p = Path('e2e/site-settings.spec.ts')
          s = p.read_text()
          s += '''\n\ntest("admin can extend standard and leader family rate tables", async ({ page }, testInfo) => {
  desktopOnly(testInfo);
  test.skip(!password, "Configure E2E_TEST_USER_PASSWORD.");
  await login(page, "test.webadmin@example.com");
  await page.goto("/leader/settings");
  await expect(page.getByTestId("subs-settings-panel")).toBeVisible();
  await page.getByTestId("subs-add-standard-rate").click();
  await expect(page.getByTestId("subs-standard-rate-5")).toBeVisible();
  await page.getByTestId("subs-standard-rate-5").getByRole("textbox").fill("734.00");
  await page.getByTestId("subs-add-leader-rate").click();
  await expect(page.getByTestId("subs-leader-rate-4")).toBeVisible();
  await page.getByTestId("subs-leader-rate-4").getByRole("textbox").fill("570.00");
  await expect(page.getByText(/no amount is inferred/i)).toBeVisible();
});
'''
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run targeted unit tests
        run: node --experimental-strip-types --test tests/unit/subsLogic.test.ts

      - name: Run source checks
        run: npm run lint && npm run build
        env:
          VITE_FIREBASE_API_KEY: demo-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-project
          VITE_FIREBASE_STORAGE_BUCKET: demo.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
          VITE_FIREBASE_APP_ID: '1:1234567890:web:demo'
          VITE_EMAIL_API_URL: https://example.invalid/email

      - name: Commit guarded patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sw52-patch.yml
          git add src/services/subsLogic.ts src/components/admin/SubsSettingsPanel.tsx firestore.rules tests/unit/subsLogic.test.ts tests/firestore/subs.rules.test.mjs e2e/site-settings.spec.ts
          git commit -m "SW-52: support open-ended family subs rates"
          git push origin HEAD:sw-52-open-ended-subs-rates
