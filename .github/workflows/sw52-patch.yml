name: SW-52 Rules Patch
on:
  push:
    branches:
      - sw-52-open-ended-subs-rates
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sw-52-open-ended-subs-rates
      - run: python scripts/sw52-rules-patch.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sw52-patch.yml scripts/sw52-rules-patch.py
          git add firestore.rules
          git commit -m "SW-52: enforce dynamic family rates in Rules"
          git push origin HEAD:sw-52-open-ended-subs-rates
