name: Seed production equipment

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose a non-writing dry run, seed, or provenance-checked rollback"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - seed
          - rollback
      confirmation:
        description: "For seed type SEED EQUIPMENT coolock-ardlea-scouts; for rollback type ROLLBACK EQUIPMENT coolock-ardlea-scouts"
        required: false
        type: string
      expected_create_count:
        description: "For seed, copy creates from a separate dry-run workflow"
        required: false
        type: string
      expected_manifest_sha256:
        description: "For seed, copy manifestSha256 from a separate dry-run workflow"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-equipment-seed
  cancel-in-progress: false

env:
  DEPLOY_ENVIRONMENT: production
  FIREBASE_PROJECT_ID: coolock-ardlea-scouts

jobs:
  equipment:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate requested action
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_CREATE_COUNT: ${{ inputs.expected_create_count }}
          EXPECTED_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$ACTION" == "seed" && ( "$CONFIRMATION" != "SEED EQUIPMENT coolock-ardlea-scouts" || ! "$EXPECTED_CREATE_COUNT" =~ ^[0-9]+$ || ! "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ) ]]; then
            echo "::error::Seed requires exact project confirmation plus count and SHA-256 copied from a separate dry run."
            exit 1
          fi
          if [[ "$ACTION" == "rollback" && "$CONFIRMATION" != "ROLLBACK EQUIPMENT coolock-ardlea-scouts" ]]; then
            echo "::error::Rollback requires exact production project confirmation."
            exit 1
          fi
      - name: Validate production operations credential target
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION_OPERATIONS }}
        run: node scripts/validate-firebase-environment.mjs --environment production --project "$FIREBASE_PROJECT_ID" --credential-env FIREBASE_SERVICE_ACCOUNT_JSON
      - name: Dry run
        if: ${{ inputs.action == 'dry-run' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION_OPERATIONS }}
        run: npm run seed:equipment
      - name: Seed reviewed equipment
        if: ${{ inputs.action == 'seed' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION_OPERATIONS }}
          PROD_EQUIPMENT_IMPORT_CONFIRM_PROJECT: coolock-ardlea-scouts
          PROD_EQUIPMENT_IMPORT_EXPECTED_CREATE_COUNT: ${{ inputs.expected_create_count }}
          PROD_EQUIPMENT_IMPORT_EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          ALLOW_PRODUCTION_MUTATION: I_UNDERSTAND
        run: npm run seed:equipment -- --execute
      - name: Roll back reviewed equipment seed
        if: ${{ inputs.action == 'rollback' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION_OPERATIONS }}
          PROD_EQUIPMENT_IMPORT_CONFIRM_PROJECT: coolock-ardlea-scouts
          ALLOW_PRODUCTION_MUTATION: I_UNDERSTAND
        run: npm run seed:equipment -- --rollback
