name: Full Test Data Reset

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/purge-test-data.mjs"
      - "scripts/seed-population-data.mjs"
      - "scripts/seed-flow-data.mjs"
      - "scripts/verify-test-population.mjs"
      - "scripts/verify-flow-data.mjs"
      - "scripts/rebuild-public-leadership.mjs"
      - ".github/workflows/test-data-reset-pr89.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-test-data-reset
  cancel-in-progress: false

jobs:
  reset-test-data:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'rebuild/about-whos-who' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Firebase Admin SDK
        run: npm install --no-save --ignore-scripts firebase-admin

      - name: Purge all marked and legacy test data
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/purge-test-data.mjs

      - name: Seed complete people and role population
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: node scripts/seed-population-data.mjs seed

      - name: Seed full-system flow examples
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/seed-flow-data.mjs

      - name: Rebuild curated public Who's Who
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/rebuild-public-leadership.mjs

      - name: Verify exact people and role population
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/verify-test-population.mjs

      - name: Verify full-system flow coverage
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/verify-flow-data.mjs

      - name: Verify full Firestore compatibility
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS }}
        run: node scripts/audit-firestore-compatibility.mjs
