name: Work Block A rules patch

on:
  push:
    branches:
      - work-block-a-parent-family-management
    paths:
      - ".github/workflows/work-block-a-rules-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work-block-a-parent-family-management
      - name: Patch family relationship rule
        env:
          OLD_RULE_B64: ""
          NEW_RULE_B64: ""
        run: python -c 'import base64,os,pathlib; p=pathlib.Path("firestore.rules"); t=p.read_text(); old=base64.b64decode(os.environ["OLD_RULE_B64"]).decode(); new=base64.b64decode(os.environ["NEW_RULE_B64"]).decode(); assert old in t, "expected member update rule not found"; p.write_text(t.replace(old,new,1))'
      - name: Commit rules patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "Authorize admin family relationship updates"
          git push origin HEAD:work-block-a-parent-family-management
