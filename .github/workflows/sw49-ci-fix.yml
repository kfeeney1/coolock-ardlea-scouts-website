name: SW-49 CI fix

on:
  push:
    branches: [sw-49-deputy-group-leader-parity]
    paths:
      - scripts/sw49-ci-fix.mjs
      - .github/workflows/sw49-ci-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sw-49-deputy-group-leader-parity
      - name: Apply guarded fixes
        run: node scripts/sw49-ci-fix.mjs
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No CI fix required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/verify-test-population.mjs
          git commit -m "SW-49 fix CI contracts"
          git push origin HEAD:sw-49-deputy-group-leader-parity
