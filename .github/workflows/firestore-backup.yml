name: Firestore Backup

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type the production Firebase project ID exactly"
        required: true
        type: string
      note:
        description: "Optional reason for this manual backup"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: firestore-production-backup
  cancel-in-progress: false

jobs:
  export:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: coolock-ardlea-scouts
      BACKUP_BUCKET: gs://coolock-ardlea-scouts.firebasestorage.app
      TRIGGER_NAME: ${{ github.event_name }}
      CONFIRM_PROJECT: ${{ inputs.confirm_project }}
      MANUAL_NOTE: ${{ inputs.note }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${PROJECT_ID}" != "coolock-ardlea-scouts" ]]; then
            echo "Backup workflow is pinned to the authoritative production project." >&2
            exit 1
          fi

          if [[ "${BACKUP_BUCKET}" != "gs://coolock-ardlea-scouts.firebasestorage.app" ]]; then
            echo "Backup workflow must use the authoritative production Storage bucket." >&2
            exit 1
          fi

          if [[ "${TRIGGER_NAME}" == "workflow_dispatch" && "${CONFIRM_PROJECT}" != "${PROJECT_ID}" ]]; then
            echo "Project confirmation did not match ${PROJECT_ID}." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COOLOCK_ARDLEA_SCOUTS_PRODUCTION_BACKUP }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify active project and bucket access
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          if [[ "${ACTIVE_PROJECT}" != "${PROJECT_ID}" ]]; then
            echo "Active gcloud project ${ACTIVE_PROJECT} does not match ${PROJECT_ID}." >&2
            exit 1
          fi

          gcloud storage ls "${BACKUP_BUCKET%/}/" >/dev/null

      - name: Export Firestore database
        id: backup
        shell: bash
        run: |
          set -euo pipefail

          TIMESTAMP="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          DESTINATION="${BACKUP_BUCKET%/}/firestore-backups/${TIMESTAMP}"

          echo "Exporting project ${PROJECT_ID} database (default) to ${DESTINATION}"
          gcloud firestore export "${DESTINATION}" \
            --project="${PROJECT_ID}" \
            --database="(default)" \
            --quiet

          echo "destination=${DESTINATION}" >> "${GITHUB_OUTPUT}"

      - name: Verify export files exist
        shell: bash
        env:
          DESTINATION: ${{ steps.backup.outputs.destination }}
        run: |
          set -euo pipefail
          gcloud storage ls "${DESTINATION}/" >/dev/null
          echo "Verified Firestore export at ${DESTINATION}"

      - name: Publish backup attempt observation
        if: always()
        continue-on-error: true
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          DESTINATION: ${{ steps.backup.outputs.destination }}
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          OBSERVED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [[ "$JOB_STATUS" == "success" && -n "${DESTINATION:-}" ]]; then
            STATE="Healthy"; REASON="Scheduled or authorised manual Firestore export completed and destination files were verified."
          else
            STATE="Critical"; REASON="Most recent Firestore backup attempt failed; an older successful export must not mask this failure."
          fi
          FIELDS=$(jq -n --arg service "Firestore Backup" --arg env "PRODUCTION" --arg metric "backup execution" --arg state "$STATE" --arg observed "$OBSERVED_AT" --arg source "Firestore Backup GitHub Actions workflow" --arg sourceType "authoritative-live" --arg reason "$REASON" --arg recovery "Inspect this workflow run and repair authentication, export or destination access before relying on older backups." --arg management "https://github.com/kfeeney1/coolock-ardlea-scouts-website/actions" '{fields:{service:{stringValue:$service},environment:{stringValue:$env},metric:{stringValue:$metric},state:{stringValue:$state},observedAt:{stringValue:$observed},source:{stringValue:$source},sourceType:{stringValue:$sourceType},reason:{stringValue:$reason},recovery:{stringValue:$recovery},managementUrl:{stringValue:$management}}}')
          curl --fail-with-body --silent --show-error -X PATCH             -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json"             --data "$FIELDS"             "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/operationalMonitoring/firestore-backup-production" >/dev/null

      - name: Write job summary
        if: always()
        shell: bash
        env:
          DESTINATION: ${{ steps.backup.outputs.destination }}
        run: |
          {
            echo "## Firestore backup"
            echo
            printf '%s\n' "- Project: \`${PROJECT_ID}\`"
            printf '%s\n' "- Backup bucket: \`${BACKUP_BUCKET}\`"
            echo "- Database: \`(default)\`"
            printf '%s\n' "- Destination: \`${DESTINATION:-not-created}\`"
            printf '%s\n' "- Trigger: \`${TRIGGER_NAME}\`"
            if [[ "${TRIGGER_NAME}" == "workflow_dispatch" && -n "${MANUAL_NOTE}" ]]; then
              printf '%s\n' "- Note: ${MANUAL_NOTE}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
