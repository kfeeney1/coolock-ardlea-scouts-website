name = "coolock-ardlea-scouts-email-local"
main = "src/entry.js"
compatibility_date = "2026-08-01"

# Local-only default. A plain `wrangler deploy` uses a distinct Worker name
# and the demo Firebase project, so it cannot overwrite TEST or PRODUCTION.
# TEST and PRODUCTION use their explicit top-level configs below.
#
# Production uses wrangler.production.toml via `npm run deploy:production`.
# Do not add a named [env.production] here: modern Wrangler deploys named
# environments as separate Workers such as `coolock-ardlea-scouts-email-production`.
[vars]
LEADER_MEDICAL_REMINDER_DAYS = "45"
# Non-production secret used only for local/TEST action-link encryption.
ACTION_LINK_SECRET = "test-only-action-link-secret-rotate-freely"
FIREBASE_PROJECT_ID = "demo-coolock-ardlea-scouts"
SITE_URL = "http://127.0.0.1:5173"
EMAIL_DELIVERY_MODE = "test"
EMAIL_FROM = "80th 160th Coolock Ardlea Scout Group <onboarding@resend.dev>"
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173"

# ADMIN_EMAILS and TEST_EMAIL_REDIRECT are intentionally not versioned here.
# Provide them through the Cloudflare deployment environment / Wrangler secrets
# or local .dev.vars. Test mode fails closed when TEST_EMAIL_REDIRECT is absent.

[triggers]
crons = ["0 8 * * *"]
