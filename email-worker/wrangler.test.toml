name = "coolock-ardlea-scouts-email-test"
main = "src/entry.js"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

# Isolated backend for the Firebase TEST application. Cloudflare secrets are
# supplied only through the protected GitHub `test` environment.
[vars]
LEADER_MEDICAL_REMINDER_DAYS = "45"
FIREBASE_PROJECT_ID = "coolock-ardlea-scouts-test"
SITE_URL = "https://coolock-ardlea-scouts-test.web.app"
EMAIL_DELIVERY_MODE = "test"
EMAIL_FROM = "80th 160th Coolock Ardlea Scout Group <onboarding@resend.dev>"
ALLOWED_ORIGINS = "https://coolock-ardlea-scouts-test.web.app"

[triggers]
crons = ["0 8 * * *"]
